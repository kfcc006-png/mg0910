.brand strong, .brand span { display: block; }
.brand strong { font-size: .96rem; letter-spacing: .08em; }
.brand span { margin-top: 4px; color: #9eb0c9; font-size: .75rem; }
.table-nav { display: grid; gap: 7px; margin-top: 24px; overflow-y: auto; }
.nav-button {

}
.nav-button:hover { color: #fff; background: rgba(255,255,255,.07); }

.nav-index { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: #9ebcff; background: rgba(66,112,210,.18); font-size: .76rem; font-weight: 800; }
.nav-button.active .nav-index { color: #fff; background: var(--blue); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .88rem; font-weight: 650; }
.nav-count { padding: 3px 7px; border-radius: 999px; color: #9eb0c9; background: rgba(255,255,255,.07); font-size: .72rem; }

.main { min-width: 0; padding: 34px clamp(22px, 4vw, 58px) 56px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px; }
.eyebrow { margin: 0 0 8px; color: var(--blue); font-size: .72rem; font-weight: 800; letter-spacing: .16em; }

.snapshot-meta { display: grid; gap: 5px; justify-items: end; color: var(--muted); font-size: .78rem; }
.snapshot-meta strong { color: var(--ink); font-size: .88rem; }

.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
.summary-card { position: relative; min-height: 132px; display: flex; flex-direction: column; justify-content: center; padding: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 8px 28px rgba(16,32,64,.04); }

.summary-card.primary::after { border-color: rgba(255,255,255,.13); }
.summary-card span { color: var(--muted); font-size: .82rem; font-weight: 650; }

.summary-card strong { margin: 7px 0 4px; font-size: 2rem; letter-spacing: -.04em; }
.summary-card small { color: #8a99ad; font-size: .74rem; }

.data-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
.panel-head { min-height: 104px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 25px; border-bottom: 1px solid var(--line); }

.table-wrap { min-height: 420px; overflow: auto; }

.pagination { display: flex; align-items: center; gap: 10px; }

(function () {
  "use strict";

  const snapshot = window.SUPABASE_SNAPSHOT || { generatedAt: "", tables: {} };
  const tableConfig = {
    branches: { label: "지점", order: ["branch_id", "branch_name", "region", "manager_name"] },
    members: { label: "조합원", order: ["member_id", "name", "birth_date", "gender", "join_date", "branch_id", "phone"] },
    deposit_accounts: { label: "예적금 계좌", order: ["account_id", "member_id", "branch_id", "account_type", "open_date", "balance", "interest_rate"] },
    loans: { label: "대출", order: ["loan_id", "member_id", "branch_id", "loan_type", "loan_amount", "interest_rate", "start_date", "due_date", "status"] },
    transactions: { label: "거래내역", order: ["transaction_id", "account_id", "transaction_date", "transaction_type", "amount", "balance_after"] },
    financial_institution_deposit_rates: { label: "금융기관 금리", order: ["id", "financial_institution_name", "region_category", "product_name", "base_rate", "maximum_preferential_rate", "preferential_conditions", "source_url", "as_of_date", "created_at"] }
  };
  const columnLabels = {
    branch_id: "지점 ID", branch_name: "지점명", region: "지역", manager_name: "지점장",
    member_id: "조합원 번호", name: "이름", birth_date: "생년월일", gender: "성별", join_date: "가입일", phone: "전화번호",
    account_id: "계좌번호", account_type: "계좌 종류", open_date: "개설일", balance: "잔액", interest_rate: "금리",
    loan_id: "대출 ID", loan_type: "대출 종류", loan_amount: "대출금액", start_date: "대출일", due_date: "만기일", status: "상태",
    transaction_id: "거래 ID", transaction_date: "거래일시", transaction_type: "거래 종류", amount: "거래금액", balance_after: "거래 후 잔액",
    id: "ID", financial_institution_name: "금융기관", region_category: "권역", product_name: "상품명", base_rate: "기본금리", maximum_preferential_rate: "최고우대금리", preferential_conditions: "주요 우대 조건", source_url: "출처", as_of_date: "기준일", created_at: "등록일시"
  };
  const amountFields = new Set(["balance", "loan_amount", "amount", "balance_after"]);
  const rateFields = new Set(["interest_rate", "base_rate", "maximum_preferential_rate"]);
  const pillFields = new Set(["region", "region_category", "gender", "account_type", "loan_type", "status", "transaction_type"]);
  const longFields = new Set(["preferential_conditions"]);
  const pageSize = 20;

  let activeTable = Object.keys(snapshot.tables)[0] || "";
  let page = 1;
  let query = "";

  const els = {
    nav: document.getElementById("tableNav"), tableCount: document.getElementById("tableCount"),
    recordCount: document.getElementById("recordCount"), selectedCount: document.getElementById("selectedCount"),
    selectedLabel: document.getElementById("selectedLabel"), snapshotTime: document.getElementById("snapshotTime"),
    technical: document.getElementById("tableTechnicalName"), title: document.getElementById("tableTitle"),
    search: document.getElementById("searchInput"), head: document.getElementById("tableHead"),
    body: document.getElementById("tableBody"), empty: document.getElementById("emptyState"),
    resultMeta: document.getElementById("resultMeta"), pageMeta: document.getElementById("pageMeta"),
    prev: document.getElementById("prevButton"), next: document.getElementById("nextButton")
  };

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
  }

  function formatValue(key, value) {
    if (value === null || value === undefined || value === "") return '<span class="muted">—</span>';
    if (amountFields.has(key)) return `<span class="amount">${Number(value).toLocaleString("ko-KR")}원</span>`;
    if (rateFields.has(key)) return `${Number(value).toLocaleString("ko-KR", { maximumFractionDigits: 2 })}%`;
    if (key === "gender") return `<span class="pill">${value === "F" ? "여성" : value === "M" ? "남성" : escapeHtml(value)}</span>`;
    if (pillFields.has(key)) return `<span class="pill">${escapeHtml(value)}</span>`;
    if (key === "source_url") return `<a href="${escapeHtml(value)}" target="_blank" rel="noreferrer">원문 보기</a>`;
    if (key === "transaction_date" || key === "created_at") return new Date(value).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
    return escapeHtml(value);
  }

  function getRows() { return snapshot.tables[activeTable] || []; }
  function getColumns(rows) {
    const configured = tableConfig[activeTable]?.order || [];
    const available = new Set(rows.flatMap(row => Object.keys(row)));
    return configured.filter(column => available.has(column));
  }
  function getFilteredRows() {
    const rows = getRows();
    if (!query) return rows;
    const needle = query.toLocaleLowerCase("ko-KR");
    return rows.filter(row => Object.values(row).some(value => String(value ?? "").toLocaleLowerCase("ko-KR").includes(needle)));
  }

  function renderNav() {
    const names = Object.keys(snapshot.tables);
    els.nav.innerHTML = names.map((name, index) => {
      const config = tableConfig[name] || { label: name };
      return `<button class="nav-button${name === activeTable ? " active" : ""}" type="button" data-table="${escapeHtml(name)}">
        <span class="nav-index">${String(index + 1).padStart(2, "0")}</span>
        <span class="nav-label">${escapeHtml(config.label)}</span>
        <span class="nav-count">${(snapshot.tables[name] || []).length}</span>
      </button>`;
    }).join("");
    els.nav.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
      activeTable = button.dataset.table;
      page = 1;
      query = "";
      els.search.value = "";
      render();
    }));
  }

  function renderTable() {
    const rows = getFilteredRows();
    const allRows = getRows();
    const columns = getColumns(allRows);
    const pages = Math.max(1, Math.ceil(rows.length / pageSize));
    page = Math.min(page, pages);
    const pageRows = rows.slice((page - 1) * pageSize, page * pageSize);
    const label = tableConfig[activeTable]?.label || activeTable;

    els.technical.textContent = `public.${activeTable}`;
    els.title.textContent = label;
    els.selectedCount.textContent = allRows.length.toLocaleString("ko-KR");
    els.selectedLabel.textContent = label;
    els.head.innerHTML = `<tr>${columns.map(column => `<th scope="col">${escapeHtml(columnLabels[column] || column)}</th>`).join("")}</tr>`;
    els.body.innerHTML = pageRows.map(row => `<tr>${columns.map(column => `<td class="${longFields.has(column) ? "long-text" : ""}">${formatValue(column, row[column])}</td>`).join("")}</tr>`).join("");
    els.empty.hidden = rows.length !== 0;
    els.resultMeta.textContent = query ? `${allRows.length.toLocaleString("ko-KR")}건 중 ${rows.length.toLocaleString("ko-KR")}건` : `총 ${rows.length.toLocaleString("ko-KR")}건`;
    els.pageMeta.textContent = `${page} / ${pages}`;
    els.prev.disabled = page <= 1;
    els.next.disabled = page >= pages;
  }

  function render() {
    renderNav();
    renderTable();
  }

  const names = Object.keys(snapshot.tables);
  els.tableCount.textContent = names.length.toLocaleString("ko-KR");
  els.recordCount.textContent = names.reduce((sum, name) => sum + snapshot.tables[name].length, 0).toLocaleString("ko-KR");
  els.snapshotTime.textContent = snapshot.generatedAt ? new Date(snapshot.generatedAt).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" }) : "—";
  els.search.addEventListener("input", event => { query = event.target.value.trim(); page = 1; renderTable(); });
  els.prev.addEventListener("click", () => { if (page > 1) { page -= 1; renderTable(); } });
  els.next.addEventListener("click", () => { const pages = Math.ceil(getFilteredRows().length / pageSize); if (page < pages) { page += 1; renderTable(); } });
  render();
})();

  </script>
